name: Build and push backend to Amazon ECR

# Builds backend/Dockerfile and pushes it to Amazon ECR whenever backend/
# changes on this branch. AWS App Runner (configured separately, once, in
# the AWS console with "auto deployment" enabled on this ECR repository)
# picks up the new image and redeploys automatically - so shipping a
# backend change is just `git push`.
#
# One-time setup this workflow depends on (see README's deployment section):
#   1. An ECR repository already created in your AWS account.
#   2. An IAM user scoped to ecr:GetAuthorizationToken / push permissions
#      on that repository, with its access key added as GitHub secrets:
#        AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   3. Two more repo variables/secrets:
#        AWS_REGION            e.g. us-east-1
#        ECR_REPOSITORY        e.g. sls-academy-api

on:
  push:
    branches:
      - claude/soft-life-academy-spec-q2q2q1
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: backend
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$REPOSITORY:latest" .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"
